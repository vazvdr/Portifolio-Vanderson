name: Test and Deploy to Vercel

on:
  push:
    branches:
      - master

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes
        run: npm run test

      - name: Validar JSON para deploy (debug)
        if: success()
        run: |
          echo "JSON enviado para deploy:"
          cat <<EOF
            {
              "projectId": "$VERCEL_PROJECT_ID",
              "target": "production"
            }
            EOF

      - name: Deploy para Vercel (só se os testes passarem)
        if: success()
        run: |
          curl --fail -X POST "https://api.vercel.com/v13/deployments" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "projectId": "'"$VERCEL_PROJECT_ID"'",
              "target": "production"
            }'
