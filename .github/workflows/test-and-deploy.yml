name: Test and Deploy to Vercel

on:
  push:
    branches:
      - master

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes
        run: npm run test

      - name: Deploy para Vercel (caso testes passem)
        if: success()
        run: |
          curl --fail -X POST "https://api.vercel.com/v13/deployments" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "name": "portifolio-vanderson",
              "projectId": "'"${{ secrets.VERCEL_PROJECT_ID }}"'",
              "orgId": "'"${{ secrets.VERCEL_ORG_ID }}"'",
              "target": "production"
            }'
